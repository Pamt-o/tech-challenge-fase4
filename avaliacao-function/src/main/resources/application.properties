quarkus.azure-functions.app-name=func-tech-challenge-consumption

# ==========================================
# CONFIGURAÇÃO LOCAL (Perfil DEV)
# Usada quando você roda 'quarkus:dev' no Docker
# ==========================================
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=quarkus
%dev.quarkus.datasource.password=quarkus
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/feedback_db
%dev.quarkus.hibernate-orm.database.generation=drop-and-create

# ==========================================
# CONFIGURAÇÃO AZURE (Perfil PROD)
# Usada quando o código roda na Function App
# ==========================================
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.hibernate-orm.database.generation=update

quarkus.http.host=0.0.0.0
quarkus.otel.logs.enabled=true
quarkus.otel.azure.applicationinsights.connection.string=InstrumentationKey=87c0c54c-cc93-402e-a9f5-0f5958876ead;IngestionEndpoint=https://spaincentral-0.in.applicationinsights.azure.com/;LiveEndpoint=https://spaincentral.livediagnostics.monitor.azure.com/;ApplicationId=76cca468-599a-4dc0-86e7-45652030fad4
quarkus.log.metrics.enabled=true
quarkus.datasource.jdbc.telemetry=true

# Desativa o Dev Services para usar o container que já está no docker-compose
quarkus.devservices.enabled=false

quarkus.jackson.write-dates-as-timestamps=false

# Para o perfil de produção (Azure)
%prod.azure.servicebus.connection-string=${AzureServiceBusConnection}
# Para o perfil de desenvolvimento (Docker local) - você precisará passar essa variável
%dev.azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING}

# A chave será lida da variável de ambiente API_KEY
app.api.key=${API_KEY}