
quarkus.azure-functions.app-name=tech-challenge-flex-quarkus
quarkus.azure-functions.resource-group=rg-tech-challenge-feedbacks
quarkus.azure-functions.region=spaincentral

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DB_USERNAME:quarkus}
%dev.quarkus.datasource.password=${DB_PASSWORD:quarkus}
%dev.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://postgres:5432/feedback_db}
%dev.quarkus.hibernate-orm.database.generation=drop-and-create

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.hibernate-orm.schema-management.strategy=none
%prod.quarkus.http.root-path=/api

quarkus.http.host=0.0.0.0
quarkus.datasource.jdbc.acquisition-timeout=10S
quarkus.devservices.enabled=false
quarkus.otel.azure.applicationinsights.connection.string=${APPLICATIONINSIGHTS_CONNECTION_STRING}
