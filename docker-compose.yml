services:
  # Serviço do ambiente de desenvolvimento Quarkus
  quarkus-dev:
    build:
      context: ./avaliacao-function
      dockerfile: ../Dockerfile.dev
    container_name: tech-challenge-quarkus-dev
    volumes:
      - ./avaliacao-function:/workspace
      - ~/.m2:/root/.m2
    working_dir: /workspace
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      # Variável para o Service Bus (usada no perfil %dev)
      - AZURE_SERVICEBUS_CONNECTION_STRING=Endpoint=sb://sb-tech-challenge-feedbacks.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=BsJyouRK0lyrGVDTHey5oN50EfXELNMWT+ASbM46tpQ=
      - API_KEY=a9d6c8f4e2001ff059fcf3522d9536e23bb848f5bd31f9ad54bf3ab40ea90c40
    depends_on:
      - postgres
    networks:
      - tech-challenge-network

  # Serviço do Banco de Dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: tech-challenge-postgres
    environment:
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus
      POSTGRES_DB: feedback_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tech-challenge-network

volumes:
  postgres_data:

networks:
  tech-challenge-network:
    driver: bridge