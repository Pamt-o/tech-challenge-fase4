services:
  # Serviço do ambiente de desenvolvimento Quarkus
  quarkus-dev:
    build:
      context: ./avaliacao-function
      dockerfile: ../Dockerfile.dev
    container_name: tech-challenge-quarkus-dev
    volumes:
      - ./avaliacao-function:/workspace
      - ~/.m2:/root/.m2
    working_dir: /workspace
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      - API_KEY=${API_KEY}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_JDBC_URL=${DB_JDBC_URL}
      - AZURE_SERVICEBUS_CONNECTION_STRING=${AZURE_SERVICEBUS_CONNECTION_STRING}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}
      - AZURE_AI_CONNECTION_STRING=${AZURE_AI_CONNECTION_STRING}
    depends_on:
      - postgres
    networks:
      - tech-challenge-network

  # Serviço do Banco de Dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: tech-challenge-postgres
    environment:
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus
      POSTGRES_DB: feedback_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tech-challenge-network

volumes:
  postgres_data:

networks:
  tech-challenge-network:
    driver: bridge
