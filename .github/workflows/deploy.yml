name: Deploy Quarkus to Azure Functions

on:
  push:
    branches: [ "main" ]

env:
  AZURE_FUNCTIONAPP_NAME: 'func-tech-challenge-consumption'
  JAVA_VERSION: '17'
  POM_XML_DIRECTORY: 'avaliacao-function' # <-- ADICIONADO

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd ${{ env.POM_XML_DIRECTORY }} # <-- ENTRA NA PASTA CORRETA
          mvn clean package -DskipTests

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: '${{ github.workspace }}/${{ env.POM_XML_DIRECTORY }}/target/azure-functions' # <-- CAMINHO CORRIGIDO
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}