name: Deploy Quarkus to Flex Consumption

on:
  push:
    branches: [ "main" ]
    paths:
      - 'avaliacao-function/**'

env:
  AZURE_FUNCTIONAPP_NAME: 'tech-challenge-flex-quarkus'
  JAVA_VERSION: '17'
  POM_XML_DIRECTORY: 'avaliacao-function'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd ${{ env.POM_XML_DIRECTORY }}
          mvn clean package -DskipTests

      - name: 'Login via OIDC'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: '${{ github.workspace }}/${{ env.POM_XML_DIRECTORY }}/target/azure-functions/tech-challenge-flex-quarkus'
          sku: flexconsumption