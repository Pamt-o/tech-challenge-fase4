    - name: 'Deploy to Azure Functions'
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 'Deploy via Azure CLI'
      run: |
        cd target/azure-functions/${{ env.AZURE_FUNCTIONAPP_NAME }}
        zip -r ../../../deploy.zip .
        cd ../../..
        az functionapp deployment source config-zip -g rg-tech-challenge-feedbacks -n ${{ env.AZURE_FUNCTIONAPP_NAME }} --src deploy.zip
