name: Deploy Processamento to Azure Functions

on:
  push:
    branches: [ "main" ]
    paths:
      - 'processamento-function/**' # Só roda quando o projeto de processamento muda

env:
  AZURE_FUNCTIONAPP_NAME: 'func-tech-challenge-processamento'
  JAVA_VERSION: '17'
  POM_XML_DIRECTORY: 'processamento-function'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd ${{ env.POM_XML_DIRECTORY }}
          mvn clean package -DskipTests

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: '${{ github.workspace }}/processamento-function/target/azure-functions/func-tech-challenge-processamento'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_PROCESSAMENTO }}