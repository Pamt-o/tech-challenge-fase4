name: Deploy Processamento to Azure Functions

on:
  push:
    branches: [ "main" ]
    paths:
      - 'processamento-function/**'

env:
  AZURE_FUNCTIONAPP_NAME: 'func-tech-challenge-processamento'
  JAVA_VERSION: '17'
  POM_XML_DIRECTORY: 'processamento-function'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd ${{ env.POM_XML_DIRECTORY }}
          mvn clean package -DskipTests

      - name: Create deployment package
        run: |
          cd ${{ env.POM_XML_DIRECTORY }}/target/azure-functions/func-tech-challenge-processamento
          zip -r ../../../../deploy-processamento.zip .

      - name: Deploy to Azure Functions via CLI
        run: |
          # Extrai o username e password do Publish Profile
          USERNAME=$(echo '${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_PROCESSAMENTO }}' | grep -oP '(?<=userName=")[^"]*')
          PASSWORD=$(echo '${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_PROCESSAMENTO }}' | grep -oP '(?<=userPWD=")[^"]*')
          
          # Faz o deploy usando o Kudu API (o mesmo que o Publish Profile usa)
          curl -X POST -u "$USERNAME:$PASSWORD" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy-processamento.zip \
            "https://${{ env.AZURE_FUNCTIONAPP_NAME }}.scm.azurewebsites.net/api/zipdeploy"